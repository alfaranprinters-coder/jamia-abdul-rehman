<!DOCTYPE html>
<html>
<head>
    <script>
    window.errors = [];
    window.onerror = function(msg, url, line, col, err) {
        window.errors.push({msg: msg, url: url, line: line, col: col, stack: err ? err.stack : ''});
        return false;
    };
    </script>
    <script src="../db.js"></script>
    <script src="../assets/js/address-data.js"></script>
    <script src="../assets/js/quran-data.js"></script>
    <script src="../hifz.js"></script>
    <script src="../app.js"></script>
</head>
<body>
    <div id="app"></div>
    <script>
    window.addEventListener('DOMContentLoaded', () => {
        const out = {
            appType: typeof window.app,
            isHTMLElement: window.app instanceof HTMLElement,
            appConstructor: window.app ? window.app.constructor.name : null,
            errors: window.errors
        };
        const d = document.createElement('div');
        d.id = 'debug-out';
        d.textContent = JSON.stringify(out, null, 2);
        document.body.appendChild(d);
    });
    </script>
</body>
</html>
